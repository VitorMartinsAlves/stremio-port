name: Build Roku app and PC companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install BrightScript compiler
        run: npm install --global brighterscript
      - name: Check companion JavaScript syntax
        run: npm --prefix companion run check
      - name: Smoke-test companion pairing and configuration
        run: npm --prefix companion run test:smoke
      - name: Validate Roku BrightScript and SceneGraph
        run: bsc --create-package false --copy-to-staging false
      - name: Package Roku app and PC companion
        run: sh ./scripts/package.sh
      - name: Upload Roku sideload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: stremio-roku-sideload
          path: dist/stremio-roku-sideload.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload PC companion ZIP
        uses: actions/upload-artifact@v4
        with:
          name: stremio-companion
          path: dist/stremio-companion.zip
          if-no-files-found: error
          retention-days: 30
