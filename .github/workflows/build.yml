name: Build sideload ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package Roku app
        run: sh ./scripts/package.sh
      - name: Upload sideload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: stremio-roku-sideload
          path: dist/stremio-roku-sideload.zip
          if-no-files-found: error
          retention-days: 30
